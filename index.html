<!doctype html>
<html lang="pt" data-livery="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fórmula 88</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F1214">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Fórmula 88">
<meta name="description" content="Fórmula 88: a melhor liga de karts acima do Mondego. Classificações, provas, pilotos e regulamento.">
<script>
/* Aplica a pintura guardada antes de a página aparecer. Fica só neste browser. */
(function () {
  try {
    var l = localStorage.getItem('f88-pintura');
    if (l) document.documentElement.setAttribute('data-livery', l);
  } catch (e) {}
  document.documentElement.className = 'f88-boot';
})();
</script>
<style>.f88-boot body { visibility: hidden; }</style>
</head>
<body>
<a class="skip" href="#app">Saltar para o conteúdo</a>
<header class="site-head">
  <div class="wrap head-row">
    <a class="logo" href="#/">FÓRMULA <span>88</span></a>
    <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="menu">Menu</button>
    <div class="menu" id="menu">
      <nav id="nav" class="nav" aria-label="Principal"></nav>
      <div class="tools">
        <select id="season-select" aria-label="Temporada"></select>
        <button type="button" class="lang-btn" id="lang-btn" lang="en" aria-label="Switch to English">EN</button>
        <details class="livery-pop" id="livery-pop">
          <summary>Pintura</summary>
          <div class="liveries" id="liveries" role="group" aria-label="Escolher pintura"></div>
        </details>
      </div>
    </div>
  </div>
  <div class="stripes" aria-hidden="true"></div>
</header>

<main id="app" class="wrap" tabindex="-1">
  <p class="loading">A carregar…</p>
</main>

<footer class="wrap site-foot">
  <p id="foot-line">Fórmula 88 · A melhor liga de karts acima do Mondego</p>
  <p><button type="button" class="link-btn" data-install hidden>Instalar como app</button></p>
</footer>

<script>
/* Esta página nunca muda: a versão vem de version.json, lido sempre de fresco, e é com ela que se pedem
   a folha de estilos e os scripts. Assim, quando o site é atualizado, basta abrir ou voltar à página. */
/* O Android avisa cedo que o site pode ser instalado; guarda-se o aviso para o botão "Instalar". */
window.F88Install = { prompt: null };
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.F88Install.prompt = e; window.dispatchEvent(new Event('f88-install')); });
(function () {
  var files = ['assets/i18n.js', 'assets/scoring.js', 'assets/xlsx.js', 'assets/replay.js', 'assets/app.js'], current = null, checked = Date.now();
  function show() { document.documentElement.classList.remove('f88-boot'); }
  function version() { return fetch('version.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) { return String(j.v); }); }
  function start(v) {
    current = v;
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'assets/style.css?v=' + v; l.onload = l.onerror = show;
    document.head.appendChild(l); setTimeout(show, 3000);
    (function next(i) {
      if (i >= files.length) return;
      var s = document.createElement('script'); s.src = files[i] + '?v=' + v; s.onload = function () { next(i + 1); };
      document.body.appendChild(s);
    })(0);
  }
  version().then(start, function () { start(String(Date.now())); });
  // ao voltar ao separador, se entretanto saiu uma versão nova, a página recarrega sozinha
  document.addEventListener('visibilitychange', function () {
    if (document.hidden || !current || Date.now() - checked < 60000) return;
    checked = Date.now();
    version().then(function (v) { if (v !== current) location.reload(); }, function () {});
  });
})();
</script>
</body>
</html>
